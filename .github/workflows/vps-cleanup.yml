# oidc-ssh-ca の検証で VPS に残った状態を片付ける一時ワークフロー。
#
# NixOS の設定から外しただけでは消えないものを対象にする。
#   - CA 秘密鍵 (サービスが実行時に生成したもの)
#   - deploy ユーザとそのホーム (mutableUsers = true のため残る)
#
# 併せて、ホスト sshd が元の設定へ戻っていることを確認する。
# 片付けが済んだらこのワークフローごと削除する。
name: VPS cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v5

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ssh/known_hosts ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'CONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          CONF
          chmod 600 ~/.ssh/config

      - name: 残留状態を削除して元の設定を確認する
        run: |
          ssh yuniruyuni@ssh.yuniruyuni.net 'bash -s' <<'REMOTE'
          set -u

          echo "===== サービスが停止していること ====="
          systemctl is-active oidc-ssh-ca 2>&1 || true
          systemctl is-enabled oidc-ssh-ca 2>&1 || true

          echo
          echo "===== CA 秘密鍵の削除 ====="
          # 検証用に自動生成した鍵。残しても使い道が無く、秘密鍵を放置する
          # 理由も無いので消す。
          if sudo test -d /var/lib/oidc-ssh-ca; then
            sudo rm -rf /var/lib/oidc-ssh-ca
            echo "削除した: /var/lib/oidc-ssh-ca"
          else
            echo "無い: /var/lib/oidc-ssh-ca"
          fi
          sudo rm -rf /var/lib/private/oidc-ssh-ca 2>/dev/null || true

          echo
          echo "===== deploy ユーザの削除 ====="
          # mutableUsers = true のため NixOS の設定から外しても残る。
          if getent passwd deploy > /dev/null; then
            sudo userdel -r deploy 2>&1 || sudo userdel deploy 2>&1 || true
            echo "削除を試みた: deploy"
          else
            echo "無い: deploy ユーザ"
          fi
          sudo rm -rf /var/lib/deploy 2>/dev/null || true

          echo
          echo "===== principal ファイル ====="
          ls /etc/ssh/principals/ 2>&1 || echo "無い (期待通り)"

          echo
          echo "===== ホスト sshd が元の設定へ戻っていること ====="
          echo "-- authorizedprincipalsfile は none であること --"
          sudo sshd -T 2>&1 | grep -i 'authorizedprincipalsfile' || echo "(出力なし)"
          echo "-- trustedusercakeys は設定されていないこと --"
          sudo sshd -T 2>&1 | grep -i 'trustedusercakeys' || echo "設定なし (期待通り)"

          echo
          echo "===== 最終確認 ====="
          getent passwd deploy > /dev/null && echo "NG: deploy ユーザが残っている" || echo "OK: deploy ユーザなし"
          sudo test -e /var/lib/oidc-ssh-ca && echo "NG: CA 鍵が残っている" || echo "OK: CA 鍵なし"
          REMOTE
