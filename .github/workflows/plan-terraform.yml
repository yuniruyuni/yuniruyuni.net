name: Terraform Plan

# plan は PR の push (pull_request) だけで起動する。run はその push の commit に
# 固定され、plan environment の承認画面にも同じ commit が出るので、承認した
# commit 以外が plan environment の secrets と OIDC トークンを持って動くことはない。
# コメントで plan を起動する経路は持たない (承認後に別の commit が走る余地を作るため)。
# 同じ commit で plan をやり直すときは Actions の Re-run を使う。

on:
  pull_request:
    paths:
      - '*.tf'
      - '.terraform.lock.hcl'
      - '.github/workflows/*-terraform*.yml'

permissions: {}

jobs:
  # フォーク PR は plan environment に入らせない。job レベルで弾くので承認待ちも作らない。
  fork-notice:
    name: Fork PR notice
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment skip message for fork PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'This PR is from a fork. Terraform plan is not run for fork PRs, so plan environment secrets never reach fork code.'
            })

  plan:
    name: Plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "v1.17.1"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -lock=false -out=tfplan
        env:
          # CLOUDFLARE_API_TOKEN in the `plan` environment MUST be a Read-only token
          # (no *:Edit scopes). Required scopes: Zone:Read, DNS:Read, Cloudflare Tunnel:Read,
          # Access: Apps and Policies:Read, Access: Service Tokens:Read.
          # The apply environment holds a separate, Edit-capable token under the same name.
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Remaining vars are configuration values that plan must evaluate to produce an
          # accurate diff (resource attributes reference them). They are not apply-specific.
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_vps_ip_address: ${{ secrets.VPS_IP_ADDRESS }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}
            #### Terraform Plan \`${process.env.PLAN_OUTCOME}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>

            *Pushed by: @${process.env.ACTOR}*`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
