# opkssh の疎通確認 (一時的)
#
# apply-nixos.yml を opkssh へ移行する前に、OIDC 由来の短命証明書だけで
# VPS に入れることを実際の Actions 環境で確かめる。長期鍵 (SSH_PRIVATE_KEY) は
# 使わない。確認が取れて移行が済んだらこのワークフローは削除する。
name: Verify opkssh

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: SSH via OIDC certificate
    runs-on: ubuntu-latest
    permissions:
      # これが無いと OIDC トークンが払い出されず opkssh login が失敗する
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install opkssh
        # 公式の install-linux.sh はサーバ用 (openssh-server の存在確認と sshd の
        # 設定まで行う) なので、クライアントではリリースバイナリを直接使う。
        #
        # バージョンは VPS 側に合わせて固定する。証明書は client が作って
        # server が検証するので、版がずれると成立しない。
        #
        # v0.10.0 (nixpkgs 25.11 の既定) は使えない。login が証明書の principals を
        # 空にするため、OpenSSH 10.3 が「Certificate lacks principal list」として
        # 拒否する。v0.16.0 は principals 未指定時に "opkssh-wildcard" を入れ、
        # verify 側が principals= を返すことで成立する。両側に必要な修正なので
        # VPS 側も 0.16.0 に上げている (nixos/pkgs/opkssh.nix)。
        env:
          OPKSSH_VERSION: v0.16.0
          OPKSSH_SHA256: c018c3e7baf98612b923e742dd87be38650bf61e3b755fb2bc90de177568b1bf
        run: |
          curl -sSLf "https://github.com/openpubkey/opkssh/releases/download/${OPKSSH_VERSION}/opkssh-linux-amd64" -o /usr/local/bin/opkssh
          echo "${OPKSSH_SHA256}  /usr/local/bin/opkssh" | sha256sum -c -
          chmod +x /usr/local/bin/opkssh
          opkssh --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp ssh/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Login (OIDC -> short-lived SSH certificate)
        run: opkssh login github

      - name: SSH into VPS
        run: |
          # 長期鍵は置いていないので、ここが通れば証明書だけで入れている。
          ssh -o ConnectTimeout=20 yuniruyuni@ssh.yuniruyuni.net \
            'echo "connected as $(id -un) on $(hostname)"; echo "cert-based login OK"'
