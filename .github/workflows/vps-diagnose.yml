name: VPS diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v5
      - name: Install cloudflared
        run: |
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ssh/known_hosts ~/.ssh/known_hosts
          printf 'Host ssh.yuniruyuni.net\n  ProxyCommand cloudflared access ssh --hostname %%h\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: n8n の状態と失敗時のログ
        run: |
          ssh yuniruyuni@ssh.yuniruyuni.net 'bash -s' <<'REMOTE'
          echo "===== 現在 ====="
          systemctl is-active podman-n8n 2>&1 || true
          systemctl show podman-n8n -p User 2>&1 || true
          echo
          echo "===== rootless 化に失敗した時点のログ ====="
          sudo journalctl -u podman-n8n --since "2026-08-20 21:50:00" --until "2026-08-20 21:53:30" --no-pager 2>&1 | tail -45 || true
          echo
          echo "===== データの所有権 ====="
          sudo ls -ldn /var/lib/n8n /var/lib/n8n/data 2>&1 || true
          echo
          echo "===== n8n ユーザ / subuid ====="
          getent passwd n8n 2>&1 || echo "(n8n ユーザなし)"
          grep "^n8n:" /etc/subuid /etc/subgid 2>&1 || echo "(subuid 未割当)"
          REMOTE
