# VPS 上の oidc-ssh-ca の状態を取得する。
#
# このリポジトリは public なので、出力は Actions のログとして公開される。
# 対象を oidc-ssh-ca のユニットに限定し、他のサービスや待ち受けポートの
# 一覧を出さないこと。
name: VPS diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v5

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ssh/known_hosts ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'CONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          CONF
          chmod 600 ~/.ssh/config

      - name: oidc-ssh-ca の状態
        run: |
          ssh yuniruyuni@ssh.yuniruyuni.net 'bash -s' <<'REMOTE'
          echo "===== systemctl status ====="
          systemctl status oidc-ssh-ca --no-pager -l || true
          echo
          echo "===== journalctl (直近 80 行) ====="
          sudo journalctl -u oidc-ssh-ca -n 80 --no-pager || true
          echo
          echo "===== 8129 の待ち受け ====="
          ss -lnt 2>/dev/null | grep -c ':8129' || echo "0 (待ち受けなし)"
          echo
          echo "===== CA 鍵の有無 ====="
          for p in /var/lib/oidc-ssh-ca/ca.pub /var/lib/private/oidc-ssh-ca/ca.pub; do
            if sudo test -f "$p"; then echo "存在する: $p"; else echo "無い: $p"; fi
          done
          echo
          echo "===== sshd 設定の反映 ====="
          sudo sshd -T 2>/dev/null | grep -iE 'trustedusercakeys|authorizedprincipalsfile' || true
          REMOTE
