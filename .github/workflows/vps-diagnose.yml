# swap パーティションの安定識別子を調べる一時ワークフロー。
# randomEncryption は by-uuid / by-label を使えない (毎回消えるため)。
name: VPS diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v7
      - name: Install cloudflared
        run: |
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ssh/known_hosts ~/.ssh/known_hosts
          printf 'Host ssh.yuniruyuni.net\n  ProxyCommand cloudflared access ssh --hostname %%h\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: swap の識別子
        run: |
          ssh yuniruyuni@ssh.yuniruyuni.net 'bash -s' <<'REMOTE'
          echo "===== 現在の swap ====="
          swapon --show 2>&1 || true
          free -h | head -3
          echo
          echo "===== ブロックデバイス ====="
          lsblk -o NAME,SIZE,TYPE,FSTYPE,UUID,PARTUUID 2>&1 || true
          echo
          echo "===== swap の安定識別子 ====="
          for d in /dev/disk/by-partuuid /dev/disk/by-id /dev/disk/by-path; do
            echo "--- $d"
            ls -l "$d" 2>/dev/null | grep -iE "swap|part" | head -10 || echo "(なし)"
          done
          REMOTE
