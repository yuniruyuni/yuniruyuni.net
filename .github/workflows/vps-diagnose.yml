# VPS 上のサービス状態を取得する一時ワークフロー。
# 手元から VPS へ SSH できないため、診断のために使う。
name: VPS diagnose

on:
  workflow_dispatch:
  push:
    branches: [debug/oidc-ssh-ca-status]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: apply
    steps:
      - uses: actions/checkout@v5

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -L "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ssh/known_hosts ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'CONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          CONF
          chmod 600 ~/.ssh/config

      - name: oidc-ssh-ca の状態
        run: |
          ssh yuniruyuni@ssh.yuniruyuni.net 'bash -s' <<'REMOTE'
          echo "===== systemctl status ====="
          systemctl status oidc-ssh-ca --no-pager -l || true
          echo
          echo "===== journalctl (直近 80 行) ====="
          sudo journalctl -u oidc-ssh-ca -n 80 --no-pager || true
          echo
          echo "===== 待ち受け ====="
          ss -lntp 2>/dev/null | grep -E '8129|LISTEN' | head -20 || true
          echo
          echo "===== CA 鍵 ====="
          sudo ls -la /var/lib/oidc-ssh-ca/ /var/lib/private/oidc-ssh-ca/ 2>&1 | head -20 || true
          echo
          echo "===== sshd 設定の反映 ====="
          sudo sshd -T 2>/dev/null | grep -iE 'trustedusercakeys|authorizedprincipalsfile' || true
          REMOTE
