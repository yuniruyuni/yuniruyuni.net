name: NixOS Validate

on:
  pull_request:
    paths:
      - 'nixos/**'
      - '.github/workflows/*-nixos*.yml'
  push:
    branches:
      - main
    paths:
      - 'nixos/**'
      - '.github/workflows/*-nixos*.yml'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Check Flake
        working-directory: nixos
        run: nix flake check --no-build

      - name: Build Configuration (dry-run)
        working-directory: nixos
        run: |
          echo "Building NixOS configuration..."
          nix build .#nixosConfigurations.vps.config.system.build.toplevel --dry-run
          echo "Configuration is valid!"

      - name: Build Configuration (full build)
        working-directory: nixos
        run: |
          echo "Building NixOS system..."
          nix build .#nixosConfigurations.vps.config.system.build.toplevel --print-build-logs
          echo "Build successful!"

      - name: Test Incus completion generation
        working-directory: nixos
        run: nix build .#checks.x86_64-linux.incus-completions --print-build-logs
